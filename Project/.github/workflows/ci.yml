name: FairPay AI CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check .

  build-and-test:
    runs-on: ubuntu-latest
    needs: lint
    env:
      FAIRPAY_OFFLINE_LLM: "1"          # agents run on the rehearsal model: no key, no cost
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install -r devkit/requirements.txt; fi
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-v1
      - name: Bootstrap (adds only what the checkout lacks)
        run: python devkit/bootstrap_demo.py --small
      - name: Step 1 - database
        run: python run_database_setup.py
      - name: Step 2 - data pipeline
        run: python run_data_pipeline.py
      - name: Step 3 - models
        run: python run_model_training.py
      - name: Model quality gate
        run: python -m ops.model_gate
      - name: Step 4 - knowledge base
        run: python run_knowledge_indexing.py
      - name: Team test suite (unit + end to end)
        run: python -m pytest tests_fairpay -q --junitxml=output/test-results.xml
      - name: Monitoring alerts after the smoke run
        run: python -m ops.monitor
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fairpay-evidence
          path: |
            output/data_quality_report.json
            output/model_metrics.json
            output/experiments/
            output/test-results.xml

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t fairpay-ai:${{ github.sha }} .
